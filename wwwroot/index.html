<!DOCTYPE html>
<!--
    Página principal do WorshipPad - Aplicação web para controle de pads musicais.
    Utiliza React via CDN e Babel Standalone para processamento JSX no cliente.
-->
<html lang="pt-BR">
<head>
    <!-- Configuração de charset e codificação de caracteres -->
    <meta charset="UTF-8">
    
    <!-- Configuração de viewport para responsividade e suporte mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    
    <!-- Meta tags para aplicação web mobile -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Título da aplicação exibido na aba do navegador -->
    <title>WorshipPad</title>
    
    <!-- Folha de estilos principal da aplicação -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Ícone da aplicação -->
    <link rel="icon" href="Worship-Pad.ico">
    
    <!-- React 18 - Biblioteca principal para construção da interface -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    
    <!-- ReactDOM 18 - Biblioteca para renderização de componentes React no DOM -->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone - Compilador JSX que permite usar sintaxe JSX diretamente no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <!-- Container raiz onde a aplicação React será renderizada -->
    <div id="root"></div>
    
    <!-- Configuração da URL da API para produção -->
    <!-- Descomente e ajuste a URL abaixo se o backend estiver em um servidor diferente -->
    <!-- <script>
        window.WORSHIP_PAD_API_URL = 'https://seu-backend-url.com/api/WorshipPad';
    </script> -->
    
    <!-- Script principal da aplicação em JSX, processado pelo Babel -->
    <script type="text/babel" src="app.jsx"></script>
</body>
</html>
